# DeepFeed AI - Production Compose (EC2)
#
# Unlike docker-compose.yml (local dev — builds images, bind-mounts source
# for hot-reload), this file runs pre-built images pushed to GHCR by
# .github/workflows/cd.yml. No `build:` here on purpose — building on a
# small instance is slow and disk-hungry (see: the EBS resize saga getting
# this stack running the first time). Deploy is just `pull` + `up -d`.
#
# Run from: deployment/docker/
#   docker compose -f docker-compose.prod.yml up -d
#
# Needs a deployment/docker/.env file (NOT committed — see .env.prod.example)
# providing: GHCR_OWNER, IMAGE_TAG, POSTGRES_PASSWORD, RABBITMQ_PASSWORD,
# GRAFANA_ADMIN_PASSWORD.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deepfeed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepfeed
      POSTGRES_USER: deepfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfeed -d deepfeed"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepfeed_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: deepfeed_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: deepfeed
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - deepfeed_net

  backend:
    image: ghcr.io/${GHCR_OWNER}/deepfeed-backend:${IMAGE_TAG:-latest}
    container_name: deepfeed_backend
    restart: unless-stopped
    env_file:
      - ../../apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://deepfeed:${POSTGRES_PASSWORD}@postgres:5432/deepfeed
      DATABASE_SYNC_URL: postgresql://deepfeed:${POSTGRES_PASSWORD}@postgres:5432/deepfeed
      CELERY_BROKER_URL: amqp://deepfeed:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_URL: amqp://deepfeed:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - deepfeed_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    image: ghcr.io/${GHCR_OWNER}/deepfeed-backend:${IMAGE_TAG:-latest}
    container_name: deepfeed_worker
    restart: unless-stopped
    env_file:
      - ../../apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://deepfeed:${POSTGRES_PASSWORD}@postgres:5432/deepfeed
      DATABASE_SYNC_URL: postgresql://deepfeed:${POSTGRES_PASSWORD}@postgres:5432/deepfeed
      CELERY_BROKER_URL: amqp://deepfeed:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - deepfeed_net
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 -Q default,discovery,processing,ranking,adaptation

  beat:
    image: ghcr.io/${GHCR_OWNER}/deepfeed-backend:${IMAGE_TAG:-latest}
    container_name: deepfeed_beat
    restart: unless-stopped
    env_file:
      - ../../apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://deepfeed:${POSTGRES_PASSWORD}@postgres:5432/deepfeed
      CELERY_BROKER_URL: amqp://deepfeed:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      - worker
    networks:
      - deepfeed_net
    command: celery -A workers.celery_app beat --loglevel=info

  frontend:
    image: ghcr.io/${GHCR_OWNER}/deepfeed-frontend:${IMAGE_TAG:-latest}
    container_name: deepfeed_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - deepfeed_net

  nginx:
    image: nginx:1.25-alpine
    container_name: deepfeed_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - deepfeed_net

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: deepfeed_prometheus
    restart: unless-stopped
    volumes:
      - ../../deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deployment/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - deepfeed_net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: deepfeed_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - deepfeed_net

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  deepfeed_net:
    driver: bridge
