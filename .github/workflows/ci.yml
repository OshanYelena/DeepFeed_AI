name: DeepFeed AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: Lint + Test ─────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deepfeed_test
          POSTGRES_USER: deepfeed
          POSTGRES_PASSWORD: deepfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (ruff)
        working-directory: apps/backend
        run: |
          pip install ruff==0.12.0
          ruff check . --ignore=E501,F401

      - name: Run migrations against the test database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://deepfeed:deepfeed@localhost:5432/deepfeed_test
          DATABASE_SYNC_URL: postgresql://deepfeed:deepfeed@localhost:5432/deepfeed_test
          APP_ENV: test
        run: |
          alembic upgrade head

      # Unit/integration/e2e run as one pytest invocation, not three separate
      # ones — coverage.xml (and pytest.ini's --cov-fail-under gate) needs to
      # see the whole suite at once. Splitting them made every individual
      # step's coverage % reflect only that slice of the codebase, so the
      # 70%-of-everything gate could never pass no matter how good the code
      # was — and the codecov upload below was silently only ever reporting
      # e2e's coverage (each step's --cov-report=xml overwrote the last).
      - name: Run tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://deepfeed:deepfeed@localhost:5432/deepfeed_test
          DATABASE_SYNC_URL: postgresql://deepfeed:deepfeed@localhost:5432/deepfeed_test
          CELERY_BROKER_URL: amqp://deepfeed:deepfeed@localhost:5672/
          JWT_SECRET_KEY: test-secret-key-minimum-32-chars-long
          APP_ENV: test
          APP_DEBUG: "false"
        run: |
          pytest tests/unit tests/integration tests/e2e -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
        if: always()

  # ── Frontend: Build + Type Check ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check

      - name: Build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Build & Push Images ──────────────────────────────────────────────────────
  # Runs on main only (after tests pass). Builds happen here — with GitHub's
  # disk/CPU, not the small EC2 box these get deployed to — and push to
  # GHCR, tagged both `latest` and the commit SHA. The deploy job below just
  # pulls whatever lands here.
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (like all Docker registries) requires lowercase repository
      # names, but github.repository_owner preserves real casing
      # ("OshanYelena") — buildx rejects that outright. Compute it once.
      - name: Compute lowercase image owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/deepfeed-backend:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/deepfeed-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/deepfeed-frontend:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/deepfeed-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # SSHes into the EC2 box and redeploys — no building there, ever. The
  # instance just needs `docker compose pull` + `up -d` against the images
  # build-and-push just published.
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/DeepFeed_AI
            git fetch origin main
            git reset --hard origin/main
            cd deployment/docker
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker exec deepfeed_backend alembic upgrade head
            docker image prune -f
