name: DeepFeed AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: Lint + Test ─────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deepfeed_test
          POSTGRES_USER: deepfeed
          POSTGRES_PASSWORD: deepfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (ruff)
        working-directory: apps/backend
        run: |
          pip install ruff
          ruff check . --ignore=E501,F401

      - name: Run unit tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://deepfeed:deepfeed@localhost:5432/deepfeed_test
          DATABASE_SYNC_URL: postgresql://deepfeed:deepfeed@localhost:5432/deepfeed_test
          CELERY_BROKER_URL: amqp://deepfeed:deepfeed@localhost:5672/
          JWT_SECRET_KEY: test-secret-key-minimum-32-chars-long
          APP_ENV: test
          APP_DEBUG: "false"
        run: |
          pytest tests/unit/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing -x

      - name: Run integration tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://deepfeed:deepfeed@localhost:5432/deepfeed_test
          JWT_SECRET_KEY: test-secret-key-minimum-32-chars-long
          APP_ENV: test
        run: |
          pytest tests/integration/ -v --tb=short -x

      - name: Run E2E tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://deepfeed:deepfeed@localhost:5432/deepfeed_test
          JWT_SECRET_KEY: test-secret-key-minimum-32-chars-long
          APP_ENV: test
        run: |
          pytest tests/e2e/ -v --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
        if: always()

  # ── Frontend: Build + Type Check ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check

      - name: Build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker Build Check ───────────────────────────────────────────────────────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: deployment/docker/Dockerfile.backend
          push: false
          tags: deepfeed-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          file: deployment/docker/Dockerfile.frontend
          push: false
          tags: deepfeed-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
